name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Release binaries are built with the single supported Go 1.26 toolchain
      # (pinned in mise.toml and go.mod) so local builds, CI, and releases match.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Require an annotated (or signed) tag
        run: |
          set -eu
          objtype="$(git cat-file -t "$GITHUB_REF_NAME")"
          echo "tag object type: $objtype"
          if [ "$objtype" != "tag" ]; then
            echo "release tags must be annotated or signed tag objects (got $objtype); create with 'git tag -a' or 'git tag -s'"
            exit 1
          fi
      - name: Enforce the tag is on main
        run: |
          set -eu
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag commit $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi
          echo "tag commit is on main"
      - name: Verify tag matches manifest and binary version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' herdr-plugin.toml | head -n1)"
          binver="$(go run ./cmd/herdr-shortcut version | awk '{print $NF}')"
          echo "tag=$tag manifest=$manifest binary=$binver"
          [ "$tag" = "$manifest" ] || { echo "tag v$tag does not match manifest version $manifest"; exit 1; }
          [ "$tag" = "$binver" ] || { echo "tag v$tag does not match binary version $binver"; exit 1; }
      - name: Quality gates
        run: make check
      - name: No-Go fallback install smoke test
        run: make smoke-nogo
      - name: Plugin verification against official Herdr v0.7.5
        run: make verify-plugin
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (source)
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build release binaries (Go 1.26)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean
      - name: Scan the built release binaries
        run: |
          set -eu
          mapfile -t bins < <(find dist -type f -name herdr-shortcut)
          [ "${#bins[@]}" -gt 0 ] || { echo "no release binaries found to scan"; exit 1; }
          for bin in "${bins[@]}"; do
            echo "scanning $bin"
            "$(go env GOPATH)/bin/govulncheck" -mode=binary "$bin"
          done

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@v0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
